<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Калькулятор</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <main class="calculator">
    <div class="calculator__display">
      
    </div>

    <div class="calculator__buttons">
      <button type="button" data-id="btn-1">C</button>
      <button type="button" data-id="btn-2">⌫</button>
      <button type="button" data-id="btn-3">%</button>
      <button type="button" data-id="btn-4">÷</button>

      <button type="button" data-id="btn-5">7</button>
      <button type="button" data-id="btn-6">8</button>
      <button type="button" data-id="btn-7">9</button>
      <button type="button" data-id="btn-8">×</button>

      <button type="button" data-id="btn-9">4</button>
      <button type="button" data-id="btn-10">5</button>
      <button type="button" data-id="btn-11">6</button>
      <button type="button" data-id="btn-12">−</button>

      <button type="button" data-id="btn-13">1</button>
      <button type="button" data-id="btn-14">2</button>
      <button type="button" data-id="btn-15">3</button>
      <button type="button" data-id="btn-16">+</button>

      <button type="button" class="btn-zero" data-id="btn-17">0</button>
      <button type="button" data-id="btn-18">.</button>
      <button type="button" class="btn-equals" data-id="btn-19">=</button>
    </div>
  </main>

  <script src="js/script.js" defer></script>
</body>
</html>
